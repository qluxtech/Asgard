<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASGARD — Autonomous M2M Infrastructure</title>

  <!-- AI / AEO Specs -->
  <meta name="agent-manifest" content="https://asgard-tgio.onrender.com/agent.json">
  <meta name="agent-protocol" content="HTTP-402-M2M">
  <link rel="llms-txt" type="text/plain" href="https://asgard-tgio.onrender.com/llms.txt">

  <style>
    :root {
      --bg: #030407;
      --surface: #0a0d14;
      --border: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(56, 189, 248, 0.3);
      --text-primary: #f1f5f9;
      --text-secondary: #8892b0;
      --accent: #38bdf8;
      --success: #34d399;
      --purple: #c084fc;
      --gold: #fbbf24;
      --pink: #f472b6;
      --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text-primary);
      font-family: var(--font-sans);
      padding: 24px 16px;
      max-width: 1100px;
      margin: 0 auto;
      -webkit-font-smoothing: antialiased;
    }

    #bg-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      pointer-events: none;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 12px;
    }

    .brand {
      font-family: var(--font-mono);
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-indicator {
      width: 6px;
      height: 6px;
      background-color: var(--success);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--success);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 0.6; }
      100% { transform: scale(1.2); opacity: 1; }
    }

    .badge-v3 {
      background: linear-gradient(135deg, rgba(168,85,247,0.2), rgba(236,72,153,0.2));
      border: 1px solid rgba(168,85,247,0.4);
      font-family: var(--font-mono);
      font-size: 0.68rem;
      padding: 2px 8px;
      border-radius: 4px;
      color: var(--pink);
    }

    .nav-links {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .nav-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 6px 12px;
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .nav-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Metrics Grid (4 items) */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      transition: border-color 0.2s ease;
    }

    .card:hover { border-color: var(--border-hover); }

    .card-label {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .card-value {
      font-family: var(--font-mono);
      font-size: 1.25rem;
      font-weight: 500;
      color: var(--text-primary);
    }

    /* QR & Onboarding Section */
    .nodes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .node-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .node-title { font-size: 0.85rem; font-weight: 500; margin-bottom: 2px; }
    .node-sub { font-family: var(--font-mono); font-size: 0.68rem; color: var(--accent); margin-bottom: 12px; }

    .qr-container {
      background: #ffffff;
      padding: 8px;
      border-radius: 6px;
      margin-bottom: 12px;
    }

    .qr-container img { width: 110px; height: 110px; display: block; }

    .address-display {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border);
      padding: 6px 10px;
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: 0.62rem;
      color: var(--text-secondary);
      width: 100%;
      word-break: break-all;
    }

    /* Onboarding Card */
    .onboard-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 20px;
      margin-bottom: 16px;
      font-family: var(--font-mono);
    }

    .onboard-title {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--gold);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .onboard-body {
      font-size: 0.7rem;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    .onboard-body code { color: var(--accent); }

    /* Terminals / Logs */
    .terminal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      margin-bottom: 16px;
    }

    .terminal-header {
      display: flex;
      justify-content: space-between;
      color: var(--text-secondary);
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
      font-size: 0.75rem;
    }

    .log-stream {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 150px;
      overflow: hidden;
    }

    .log-row {
      display: flex;
      gap: 10px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .log-time { color: rgba(255,255,255,0.3); }
    .log-tag { color: var(--purple); font-weight: 500; }
    .log-msg { color: var(--success); }
